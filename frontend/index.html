<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Office Intelligence</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Family Office Intelligence</h1>
      <p class="sub">Ask about verified family offices — who to contact, why them, and why now.</p>
    </header>

    <section class="search">
      <div class="searchbar">
        <input id="q" type="text" autocomplete="off"
               placeholder="e.g. family offices in New York with a recent signal">
        <button id="ask" type="button">Ask</button>
      </div>
      <div class="chips" id="examples">
        <button class="chip" type="button">family offices in New York</button>
        <button class="chip" type="button">firms with a recent investment signal</button>
        <button class="chip" type="button">single family offices</button>
        <button class="chip" type="button">who leads Duquesne Family Office?</button>
      </div>
    </section>

    <section id="answer" class="answer" aria-live="polite"></section>

    <footer class="foot">
      Answers come only from verified records. When the evidence is thin, the
      system says so rather than guessing.
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
