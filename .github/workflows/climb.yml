name: family-office-climb

# S15/S16/S17 — the unattended climb toward 500 qualifying records.
# Each run enriches the next batch of un-attempted candidates (durable, idempotent
# state in data/state/climb_pool.json) and commits the accumulated dataset back to
# the repo, so the Actions tab is the run history and git is the replay/state log.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: firms to process this run
        default: "60"
  schedule:
    - cron: "0 */3 * * *"        # every 3 hours

permissions:
  contents: write                 # commit the accumulated state + dataset back

concurrency:
  group: climb                    # never let two climbs run at once
  cancel-in-progress: false

jobs:
  climb:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install climb dependencies
        run: pip install requests pandas dnspython python-dotenv beautifulsoup4 lxml

      - name: Run one climb increment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          CLIMB_BATCH: ${{ github.event.inputs.batch || '60' }}
          CLIMB_APOLLO_EMAILS: ${{ vars.CLIMB_APOLLO_EMAILS || '20' }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pipeline.climb | tee climb_summary.json

      - name: Show run summary
        run: cat climb_summary.json

      - name: Commit accumulated results
        run: |
          git config user.name "fo-climb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state/climb_pool.json data/final/dataset.csv data/final/climb_audit.csv || true
          if git diff --staged --quiet; then
            echo "no changes to commit"; exit 0
          fi
          git commit -m "climb: scheduled run $(date -u +%FT%TZ) [skip ci]"
          # A concurrent push (dev or another run) moves main, so rebase our commit
          # on top and retry — the bot owns the data files, so prefer our version.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push race — retrying ($i)"; sleep $((RANDOM % 8 + 3))
          done
          echo "push failed after retries"; exit 1
