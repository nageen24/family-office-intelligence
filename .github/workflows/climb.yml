name: family-office-climb

# S15/S16/S17 — the unattended climb toward 500 qualifying records.
# Each run enriches the next batch of un-attempted candidates (durable, idempotent
# state in data/state/climb_pool.json) and commits the accumulated dataset back to
# the repo, so the Actions tab is the run history and git is the replay/state log.

on:
  # FROZEN FOR SUBMISSION: the scheduled cron is disabled so the repo does not
  # change before review. Manual dispatch is kept for post-submission use; to
  # resume automatic runs, restore the `schedule:` block below.
  workflow_dispatch:
    inputs:
      batch:
        description: firms this run (blank = provider-scaled default)
        default: ""
  # schedule:
  #   - cron: "0 */3 * * *"        # every 3 hours  (disabled — repo frozen for submit)

permissions:
  contents: write                 # commit the accumulated state + dataset back

concurrency:
  group: climb                    # never let two climbs run at once
  cancel-in-progress: false

jobs:
  climb:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install climb dependencies
        run: |
          pip install requests pandas dnspython python-dotenv beautifulsoup4 lxml playwright
          # browser layer: find websites for the name-only firms (EDGAR/990/News/
          # CIK) so they can reach function proof. Graceful — if this ever fails,
          # render.available() is False and the climb falls back to static fetch.
          python -m playwright install --with-deps chromium || echo "playwright install failed — browser layer will no-op"

      - name: Run one climb increment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          SNOV_CLIENT_ID: ${{ secrets.SNOV_CLIENT_ID }}
          SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
          # empty on a scheduled run -> the climb uses its provider-scaled default
          CLIMB_BATCH: ${{ github.event.inputs.batch }}
          CLIMB_APOLLO_EMAILS: ${{ vars.CLIMB_APOLLO_EMAILS || '20' }}
          CLIMB_BROWSER: ${{ vars.CLIMB_BROWSER || '1' }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pipeline.climb | tee climb_summary.json

      - name: Show run summary
        run: cat climb_summary.json

      - name: Commit accumulated results
        run: |
          git config user.name "fo-climb-bot"
          git config user.email "actions@users.noreply.github.com"
          # Add each path only if it exists — a single missing pathspec (e.g.
          # email_quota.json when no email keys are set, or needs_human.json when
          # nothing escalated) makes `git add a b missing` stage NOTHING, which
          # silently produced "no changes to commit" and lost every run's state.
          # Quota/escalation files still persist across runs when present.
          for f in data/state/climb_pool.json data/final/dataset.csv \
                   data/final/climb_audit.csv data/state/serper_quota.json \
                   data/state/email_quota.json data/state/needs_human.json \
                   data/state/run_history.jsonl docs/DATASET_REPORT.md; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "no changes to commit"; exit 0
          fi
          git commit -m "climb: scheduled run $(date -u +%FT%TZ) [skip ci]"
          # A concurrent push (dev or another run) moves main, so rebase our commit
          # on top and retry — the bot owns the data files, so prefer our version.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push race — retrying ($i)"; sleep $((RANDOM % 8 + 3))
          done
          echo "push failed after retries"; exit 1
